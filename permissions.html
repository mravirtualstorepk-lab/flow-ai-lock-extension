<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Permissions</title>
<link rel="stylesheet" href="blocked.css">
</head>
<body>

<div class="card">

<h2>User Permissions</h2>

<label><input type="checkbox" id="gmail"> Gmail</label><br>
<label><input type="checkbox" id="drive"> Google Drive</label><br>
<label><input type="checkbox" id="youtube"> YouTube</label><br>
<label><input type="checkbox" id="chatgpt"> ChatGPT</label><br>
<label><input type="checkbox" id="maps"> Google Maps</label><br>
<label><input type="checkbox" id="photos"> Google Photos</label><br>
<label><input type="checkbox" id="calendar"> Calendar</label><br>
<label><input type="checkbox" id="meet"> Google Meet</label><br>

<hr>

<label><input type="checkbox" id="gemini" checked> Gemini</label><br>
<label><input type="checkbox" id="flow" checked> Flow AI</label><br><br>

<button id="save">Save Permissions</button>

</div>

<script src="permissions.js"></script>

</body>
</html>
